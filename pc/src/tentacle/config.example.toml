# tentacle configuration — the ONLY place for tunables.
# Location: --config PATH > $TENTACLE_CONFIG > $XDG_CONFIG_HOME/tentacle/config.toml
# Paths accept ~ and $ENV_VARS.

[phone]
# Choose one connection mode; the phone API and token are the same in every mode:
# LAN: the phone's Wi-Fi address and local server port.
# USB: the adb-forwarded loopback address and local server port.
# Tailscale: the phone's 100.x address and local server port (the app's
# built-in Tailscale or the Tailscale app).
# Own server: an HTTPS URL with an optional path prefix, for example
# https://example.com/tentacle (nginx forwards it to the SSH reverse tunnel).
# The app's pairing link fills in url, urls and token with `tentacle pair`.
url = ""                       # e.g. "https://example.com/tentacle"
# Several addresses of the same phone, in preference order. When non-empty it
# replaces url: each command uses the first one that answers a short ping
# (cached for 60 s). A tailnet address (100.64.0.0/10) is skipped while the
# local Tailscale client reports a relayed path and a later address works.
urls = []                      # e.g. ["http://100.64.0.1:8765", "https://example.com/tentacle"]
token = ""                     # inline token, or use one of:
token_file = ""                # file containing the token
token_env = ""                 # env var holding the token
timeout_s = 20
find_timeout_s = 120           # longer timeout for storage walks
use_system_proxy = false       # LAN, loopback and tailnet addresses never use a proxy

[storage]
data_dir = "~/.local/share/tentacle"   # downloaded recordings and cached transcripts

# Where recordings appear on the phone. Paths are relative to internal storage
# (/storage/emulated/0) or absolute. Run `tentacle discover` to find candidates.
# name_pattern: Python regex with optional named groups app / counterpart / ts;
# ts_format: strptime format for the ts group. Without them, mtime is used.
[[sources]]
name = "app-call"              # Xiaomi HyperOS "AI 录音纪要" (WeChat / Feishu / QQ calls)
path = "MIUI/sound_recorder/app_rec"
extensions = ["aac", "m4a", "mp3", "amr", "wav", "ogg", "opus"]
name_pattern = '^(?P<app>\S+?)录音 (?P<counterpart>.+?)_(?P<ts>\d{14})'
ts_format = "%Y%m%d%H%M%S"
min_age_s = 60                 # newer files are listed with recording=true

[[sources]]
name = "call"                  # system phone-call recorder
path = "MIUI/sound_recorder/call_rec"
extensions = ["aac", "m4a", "mp3", "amr", "wav", "ogg", "opus"]
name_pattern = '^(?P<counterpart>.+?)_(?P<ts>\d{14})'
ts_format = "%Y%m%d%H%M%S"
min_age_s = 60                 # newer files are listed with recording=true

[calls]
timezone = ""                  # IANA zone of timestamps in file names; empty = the phone's reported zone

[asr]
backend = "funasr"             # funasr | faster-whisper | command | none
language = "zh"
model = ""                     # empty = backend default (funasr: paraformer-zh; faster-whisper: large-v3)
diarize = true                 # speaker labels (funasr: cam++ clustering; ignored by backends without it)
device = "auto"                # auto | cuda | cpu
compute_type = "auto"          # faster-whisper only: float16 / int8_float16 / int8 / auto
initial_prompt = ""            # faster-whisper only: vocabulary hint (names, jargon)
hotwords = []                  # funasr only: hotword list (names, project terms)
command = []                   # backend="command": argv template, placeholders {input} {output}

[requests]
# No agent command is supplied by default. Configure one with
# `tentacle requests setup --command "..."`; the watcher refuses to run without it.
command = ""
shell = ["bash", "-lc"]        # use ["bash", "-ic"] for a function from interactive bash startup
repo = ""
# Optional branch/PR routing. `base` empty discovers the remote default branch.
base = ""                     # example: "main"
push_remote = "origin"        # git remote that receives request branches
pr_repo = ""                  # example: "owner/tentacle"; empty resolves from push_remote
fork_repo = ""                # example: "/path/to/personal-tentacle"; separate checkout
fork_release = ""             # example: "scripts/release-personal.sh"
review_command = ""           # example: "review-agent --read-only"; empty disables watch reviews
release = ""                  # required for maintainer merges; example: "scripts/release.sh"
test = ""                      # empty skips an extra watcher-run test command
push = "git push"             # direct personal-fork push command
timeout_s = 7200               # shared budget for agent, test, push and release
prompt_template = ""           # replaces only the middle prompt template, never the fixed rules
protected = [
  ".github/**",
  "**/*.jks",
  "**/*.keystore",
  "**/*.p12",
  "android/app/src/main/kotlin/dev/tentacle/update/**",
  "android/core/src/main/kotlin/dev/tentacle/core/Tokens.kt",
]

