[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tentacle"
version = "0.7.3"
description = "A manual toolkit for browsing phone files and pulling or transcribing call recordings."
readme = {text = "Tentacle is a manual toolkit for browsing phone files and pulling or transcribing call recordings.", content-type = "text/plain"}
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1", "av"]
funasr = ["funasr>=1.2", "torch", "torchaudio", "av"]

[project.scripts]
tentacle = "tentacle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tentacle = ["config.example.toml"]
